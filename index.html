<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiSantoss Studio</title>
<style>
  :root { --teal:#2EC4C9; --pink:#FF5C8E; --ink:#1F2A30; --soft:#5A6870; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink);
         background: radial-gradient(circle at 50% 25%, #6FE0E0, var(--teal) 70%); min-height:100vh; display:grid; place-items:center; }
  main { background:#fff; border-radius:28px; padding:36px 28px; margin:24px 16px; width:min(560px, calc(100% - 32px)); text-align:center; box-shadow:0 20px 50px rgba(0,60,70,.25); }
  h1 { margin:14px 0 6px; font-size:30px; } p { line-height:1.55; margin:8px 0; }
  .tag { color:var(--pink); font-weight:800; }
  .btns { margin-top:22px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btns a { color:#fff; background:var(--pink); padding:10px 18px; border-radius:999px; text-decoration:none; font-weight:700; }
  .btns a.alt { background:var(--ink); }
  .foot { margin-top:18px; font-size:14px; color:var(--soft); }
  .game { display:flex; gap:16px; align-items:center; text-align:left; padding:14px; border-radius:20px; background:#F3FAFA; color:inherit; text-decoration:none; margin-top:18px; }
  .game img { width:84px; height:84px; border-radius:20px; flex:none; box-shadow:0 6px 14px rgba(0,0,0,.15); }
  .game b { font-size:18px; } .game span { display:block; color:var(--soft); font-size:14px; margin-top:2px; }
</style></head>
<body><main>

  <h1>DiSantoss Studio</h1>
  <p>Mobil oyunlar · Mobile games</p>
  <a class="game" href="brew-street-cafe/">
    <img src="brew-street-cafe/icon.png" alt="">
    <div><b>Brew Street Café</b><span>Kahve dükkanını büyüt! · Grow your coffee shop!</span></div>
  </a>
  <a class="game" href="mushroom-bus-rush/">
    <img src="mushroom-bus-rush/icon.png" alt="">
    <div><b>Mushroom Bus Rush</b><span>Otobüsleri çıkar, mantarları bindir! · Clear the lot, board the mushrooms!</span></div>
  </a>
  <p class="foot">İletişim · Contact: <a href="mailto:mevlutatugmk@gmail.com">mevlutatugmk@gmail.com</a></p>
</main></body></html>
