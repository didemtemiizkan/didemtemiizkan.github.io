<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mushroom Bus Rush – İndir</title>
<meta name="description" content="Mushroom Bus Rush: renkleri eşleştir, otobüsleri doldur, otoparkı boşalt! App Store ve Google Play'de ücretsiz.">
<meta property="og:title" content="Mushroom Bus Rush">
<meta property="og:description" content="Renkleri eşleştir, otobüsleri doldur, otoparkı boşalt! Ücretsiz indir.">
<meta property="og:image" content="https://didemtemiizkan.github.io/mushroom-bus-rush/icon.png">
<link rel="icon" href="../mushroom-bus-rush/icon.png">
<script>
(function(){
  // ---- ayarlar ----
  var GC='disantoss'; // GoatCounter hesap kodu (https://disantoss.goatcounter.com)
  var IOS='https://apps.apple.com/app/id6833046549';
  var PKG='com.otobuscilginligi.app';
  // ------------------
  var q=new URLSearchParams(location.search);
  var src=(q.get('k')||q.get('utm_source')||'direkt').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,30)||'direkt';
  var ua=navigator.userAgent||'';
  var ios=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var android=/Android/i.test(ua);
  var dev=ios?'ios':android?'android':'masaustu';
  var ref='utm_source%3D'+src+'%26utm_medium%3Dlink%26utm_campaign%3Dmbr';
  var PLAY='https://play.google.com/store/apps/details?id='+PKG+'&referrer='+ref;
  var MARKET='market://details?id='+PKG+'&referrer='+ref;
  window.__links={ios:IOS,play:PLAY};
  // tıklamayı say: /mbr/<kaynak>/<cihaz>
  try{
    if(!/bot|crawl|spider|preview|facebookexternalhit/i.test(ua)){
      var u='https://'+GC+'.goatcounter.com/count?p='+encodeURIComponent('/mbr/'+src+'/'+dev)+
        '&t='+encodeURIComponent('Mushroom Bus Rush · '+src+' · '+dev)+'&r='+encodeURIComponent(document.referrer||'')+'&rnd='+Math.random().toString(36).slice(2);
      if(window.fetch)fetch(u,{mode:'no-cors',keepalive:true,credentials:'omit'}).catch(function(){});
      else (new Image()).src=u;
    }
  }catch(e){}
  function go(){
    if(ios){location.replace(IOS);return}
    if(android){
      var t=setTimeout(function(){location.replace(PLAY)},1200);
      document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(t)});
      location.href=MARKET;return}
  }
  setTimeout(go,250);
})();
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2433;
    background:radial-gradient(circle at 50% 20%,#7cc4ff 0,#2f7bff 45%,#1b2a6b 100%)}
  .card{width:100%;max-width:380px;background:#fff;border:4px solid #1f2433;border-radius:28px;padding:28px 24px 24px;text-align:center;
    box-shadow:0 8px 0 #1f2433,0 18px 40px rgba(0,0,0,.3)}
  img{width:112px;height:112px;border-radius:26px;box-shadow:0 5px 0 #1f2433}
  h1{margin:16px 0 4px;font-size:28px;font-weight:900}
  p{margin:0 0 20px;color:#4a5170;font-size:15px;line-height:1.45}
  a.b{display:block;margin-top:12px;padding:15px;border-radius:16px;border:3px solid #1f2433;text-decoration:none;font-weight:800;font-size:17px;box-shadow:0 5px 0 #1f2433}
  a.b:active{transform:translateY(3px);box-shadow:0 2px 0 #1f2433}
  .ios{background:#1f2433;color:#fff}
  .gp{background:#22b04a;color:#fff}
  small{display:block;margin-top:16px;color:#8a90a8;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <img src="../mushroom-bus-rush/icon.png" alt="Mushroom Bus Rush">
  <h1>Mushroom Bus Rush</h1>
  <p id="d">Renkleri eşleştir, otobüsleri doldur, otoparkı boşalt!</p>
  <a class="b ios" id="bi" href="https://apps.apple.com/app/id6833046549">App Store</a>
  <a class="b gp" id="bg" href="https://play.google.com/store/apps/details?id=com.otobuscilginligi.app">Google Play</a>
  <small id="s">Mağazaya yönlendiriliyorsunuz…</small>
</div>
<script>
  if(window.__links){document.getElementById('bi').href=__links.ios;document.getElementById('bg').href=__links.play}
  if(!/^tr/i.test(navigator.language||'')){document.documentElement.lang='en';
    document.getElementById('d').textContent='Match the colors, fill the buses, clear the lot!';
    document.getElementById('s').textContent='Taking you to the store…'}
  if(!/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent)))
    document.getElementById('s').textContent=/^tr/i.test(navigator.language||'')?'Telefonunda açmak için mağazanı seç.':'Choose your store.';
</script>
</body>
</html>
